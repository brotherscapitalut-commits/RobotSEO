name: CI

on:
  push:
    branches: [main, desenvolvimento-autonomous-seo]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q app config.py run.py
      - name: Import Flask application
        env:
          SECRET_KEY: ci-secret
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci-test-password
          DATABASE_URL: sqlite:///ci.db
        run: python -c "from app import create_app; app=create_app(); print('Application import OK')"
