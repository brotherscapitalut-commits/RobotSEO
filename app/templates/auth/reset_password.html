{% extends "base.html" %}
{% block title %}Nova senha{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center">
  <div class="glass rounded-2xl p-8 w-full max-w-md mx-4">
    <h1 class="text-xl font-bold text-white mb-1">Criar nova senha</h1>
    <form method="POST" class="space-y-4 mt-6">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="password" name="password" required minlength="8" placeholder="Nova senha (mín. 8 caracteres)" class="w-full bg-ink-700 border border-white/10 rounded-xl px-4 py-3 text-white text-sm">
      <button class="w-full bg-gradient-to-r from-brand-600 to-purple-600 text-white font-semibold py-3 rounded-xl">Redefinir senha</button>
    </form>
  </div>
</div>
{% endblock %}
