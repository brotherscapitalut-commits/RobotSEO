{% extends "base.html" %}
{% block title %}Esqueci minha senha{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center">
  <div class="glass rounded-2xl p-8 w-full max-w-md mx-4">
    <h1 class="text-xl font-bold text-white mb-1">Redefinir senha</h1>
    <p class="text-slate-400 text-sm mb-6">Digite seu e-mail e enviaremos um link de redefinição.</p>
    <form method="POST" class="space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="email" name="email" required placeholder="voce@empresa.com" class="w-full bg-ink-700 border border-white/10 rounded-xl px-4 py-3 text-white text-sm">
      <button class="w-full bg-gradient-to-r from-brand-600 to-purple-600 text-white font-semibold py-3 rounded-xl">Enviar link</button>
    </form>
    <p class="text-center text-sm text-slate-400 mt-6">
      <a href="{{ url_for('auth.login') }}" class="text-brand-400 hover:underline">← Voltar ao login</a>
    </p>
  </div>
</div>
{% endblock %}
