<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}AutoSEO AI{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:{50:'#eafff2',100:'#c9ffdd',400:'#55ff99',500:'#00FF66',600:'#00dc58',700:'#00b948'},ink:{900:'#050507',800:'#0a0a0d',700:'#101014',600:'#17171c'}},fontFamily:{sans:['Inter','ui-sans-serif','system-ui']},boxShadow:{glow:'0 0 40px -10px rgba(0,255,102,.35)'}}}};</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif}.glass{background:rgba(255,255,255,.035);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08)}.gradient-text{background:linear-gradient(90deg,#00FF66,#b8ffd0);-webkit-background-clip:text;background-clip:text;color:transparent}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#29292f;border-radius:8px}</style>
<meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body class="bg-ink-900 text-slate-200 min-h-screen">
{% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}<div class="fixed top-5 right-5 z-50 space-y-2" id="flashes">{% for category,msg in messages %}<div class="glass px-5 py-3 rounded-xl shadow-glow text-sm {{ 'text-emerald-300 border-emerald-500/30' if category=='success' else 'text-rose-300 border-rose-500/30' }}">{{ msg }}</div>{% endfor %}</div><script>setTimeout(()=>{const f=document.getElementById('flashes');if(f)f.remove()},4000)</script>{% endif %}{% endwith %}
{% block body %}{% endblock %}
<script>const _csrfToken=document.querySelector('meta[name="csrf-token"]').content;const _origFetch=window.fetch;window.fetch=function(url,options={}){options.headers=options.headers||{};const method=(options.method||'GET').toUpperCase();if(method!=='GET'&&method!=='HEAD')options.headers['X-CSRFToken']=_csrfToken;return _origFetch(url,options)};</script>
</body></html>
